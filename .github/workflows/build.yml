name: Build and Deploy Plugin
run-name: "Build ${{ github.event.repository.name }} — ${{ github.ref_name }}"

on:
  push:
  workflow_dispatch:
    inputs:
      USE_BUILD_CACHE:
        type: boolean
        default: true
      USE_DEPENDENCY_CACHE:
        type: boolean
        default: true

env:
  IS_DEPLOY: ${{ github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          java-package: jdk

      - name: Prepare VPS credentials in settings.xml
        if: env.IS_DEPLOY == 'true'
        run: |
          sed -i "s/<username>GAMA_PLATFORM/<username>${GAMA_SERVER_USERNAME}/g" settings.xml
          sed -i "s/<password>GAMA_PLATFORM/<password>${GAMA_SERVER_PASSWORD}/g" settings.xml
        env:
          GAMA_SERVER_USERNAME: ${{ secrets.GAMA_SERVER_USERNAME }}
          GAMA_SERVER_PASSWORD: ${{ secrets.GAMA_SERVER_PASSWORD }}

      - name: Install SSH key
        if: env.IS_DEPLOY == 'true'
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GAMA_SERVER_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.GAMA_SERVER_SSH_KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Import JAR signing keystore
        if: env.IS_DEPLOY == 'true'
        run: |
          echo "$GAMA_KEYSTORE_BASE64" | base64 --decode > ~/gama.keystore
          sed -i "s/<storepass>GAMA_STORE/<storepass>${GAMA_STORE}/g" gama.plugin.parent/pom.xml
        env:
          GAMA_KEYSTORE_BASE64: ${{ secrets.GAMA_KEYSTORE_BASE64 }}
          GAMA_STORE: ${{ secrets.GAMA_KEYSTORE_STOREPASS }}

      - uses: gama-platform/gama/.github/actions/maven-build-cache@main
        name: Restore Maven Build cache
        if: "${{ inputs.USE_BUILD_CACHE || github.event_name == 'push' }}"
        with:
          action: restore
          
      - uses: gama-platform/gama/.github/actions/maven-dependency-cache@main
        name: Restore Maven Dependency Cache
        if: "${{ inputs.USE_DEPENDENCY_CACHE || github.event_name == 'push' }}"
        with:
          action: restore

      - name: Build and deploy
        if: env.IS_DEPLOY == 'true'
        run: bash build.sh
        env:
          PLUGIN_REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Compile only
        if: env.IS_DEPLOY == 'false'
        run: bash build.sh
        env:
          PLUGIN_REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}

      - uses: gama-platform/gama/.github/actions/maven-dependency-cache@main
        name: Save Maven Dependency Cache
        if: "${{ (inputs.USE_DEPENDENCY_CACHE || github.event_name == 'push') && (github.ref_name == 'GAMA_2026-06') }}"
        with:
          action: save
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - uses: gama-platform/gama/.github/actions/maven-build-cache@main
        name: Save Maven Build Cache
        if: "${{ inputs.USE_BUILD_CACHE || github.event_name == 'push' }}"
        with:
          action: save
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Notify composite repo
        if: success() && env.IS_DEPLOY == 'true'
        run: |
          gh api "repos/${{ github.repository_owner }}/p2composite/dispatches" \
            --field event_type=plugin-deployed \
            --field "client_payload[repo]=${{ github.repository }}" \
            --field "client_payload[name]=${{ github.event.repository.name }}"
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
